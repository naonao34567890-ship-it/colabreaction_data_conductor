<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Colab計算記録</title><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script><script src="common.js"></script><script src="worker.js"></script><link rel="stylesheet" href="library-nav.css"><style>#colabPage { height: 100dvh; overflow: hidden; }
.page > .mode-switch { flex-shrink: 0; }
#colabPanel { display: flex; flex: 1; flex-direction: column; min-height: 0; }
#colabControls { flex-shrink: 0; max-height: 65%; overflow-y: auto; }
#colabResults { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
#colabDrop { padding: 24px; border: 1px dashed var(--border); margin: 12px 0; }
#classificationChoices { display: grid; gap: 6px; max-height: min(240px, 32dvh); overflow-y: auto; overscroll-behavior: contain; }
#classificationChoices button { min-width: 0; white-space: normal; overflow-wrap: anywhere; text-align: left; }
#classificationDialog .dialog-actions { flex-wrap: wrap; }
.colab-group-heading { padding: 6px 0; border-bottom: 1px solid var(--border); overflow-wrap: anywhere; }
#colabJobs { display: grid; gap: 12px; }
.colab-job { padding: 12px; border: 1px solid var(--border); border-radius: 10px; }
.colab-notes { margin: 4px 0 10px; padding: 8px; border: 1px solid var(--border); border-radius: 6px; }
.colab-note-text { white-space: pre-wrap; overflow-wrap: anywhere; cursor: text; }
.colab-note-text:empty::before { content: "ダブルクリックで備考を入力"; color: var(--muted); }
.colab-note-error { color: #ff929f; }
.colab-record-name { margin: 0 0 8px; overflow-wrap: anywhere; }
#classificationCreate:enabled { background:#a82b40; color:white; border-color:#e27082; }
.colab-images { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.colab-meta { display: flex; gap: 16px; overflow-x: auto; white-space: nowrap; padding: 8px 0; }
.colab-images figure { min-width: 0; margin: 0; }
.colab-images img { display: block; width: 100%; height: 150px; object-fit: contain; }
</style></head>
<body><div class="page" id="colabPage">
<nav class="mode-switch" aria-label="ナビゲーション">
<a class="mode-link" href="index.html">分子ライブラリ</a>
<a class="mode-link" href="reactions.html">反応ライブラリ</a>
<a class="mode-link" href="colab.html" aria-current="page">Colab計算記録</a>
</nav>
<section id="colabPanel" aria-labelledby="colabTitle">
<h1 id="colabTitle">Colab計算記録</h1>
<div id="colabControls">
<button id="driveConnect" type="button" class="primary">Google Driveに接続</button>
<button id="driveTemporary" type="button">一時接続</button>
<form id="driveSetup" hidden>
<label>Googleクライアントシークレット
<input id="driveSecret" type="password" autocomplete="new-password" required>
</label>
<button type="submit">設定を保存</button>
</form>
<div id="colabDrop">
<label>計算結果のZIPまたはフォルダーをドロップ
<input id="colabZip" type="file" multiple accept=".zip,application/zip" disabled>
</label>
<label>フォルダーを選択 <input id="colabFolder" type="file" webkitdirectory multiple disabled></label>
</div>
<p id="colabStatus" role="status">Google Driveに接続すると計算記録を表示します。</p>
<p id="colabQueue" role="status">待機中 0件</p>
<div id="colabErrors" role="status"></div>
<label>並び順 <select id="colabOrder" autocomplete="off">
<option value="name-asc">名前順</option>
<option value="added-asc">追加時間昇順</option>
<option value="added-desc">追加時間降順</option>
<option value="name-desc">名前逆順</option>
<option value="id">内部ID順</option>
<option value="classification" selected>分類の名前順</option>
</select></label>
</div>
<div id="colabResults" role="region" aria-label="計算記録一覧" tabindex="0">
<div id="colabJobs"></div>
<p id="colabLoading" class="muted" role="status" hidden>ロード中…</p>
</div>
<dialog id="classificationDialog" aria-labelledby="classificationTitle">
<h2 id="classificationTitle">分類を選ぶ</h2>
<p id="classificationCurrent"></p>
<div id="classificationChoices"></div>
<div class="dialog-actions">
<button type="button" id="classificationNew">新規に作る</button>
<button type="button" id="classificationRename">名前を変更する</button>
<button type="button" id="classificationRemove" class="danger">分類を外す</button>
<button type="button" id="classificationCancel">キャンセル</button>
</div>
<form id="classificationForm" hidden>
<label>分類名<input id="classificationName" required></label>
<button id="classificationCreate" class="danger" disabled>作成して設定</button>
</form>
<p id="classificationStatus" role="status"></p>
</dialog>
</section>
</div><script type="module" src="colab-records.js"></script></body></html>
