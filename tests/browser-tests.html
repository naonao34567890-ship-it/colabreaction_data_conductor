<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>分子ライブラリ検証</title><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script><script src="../dist/common.js"></script></head><body style="padding:24px"><h1>ブラウザ検証（合成データ）</h1><p>この画面の登録テストは、同じライブラリへ検証用分子を保存します。</p><div class="toolbar"><button id="start">3000ファイル登録テスト</button><button id="cancel" disabled>テスト登録をキャンセル</button><button id="virtual">13万件の仮想スクロールテスト</button><button id="bottom">末尾に移動</button></div><pre id="status">待機中</pre><div id="grid" class="grid-view" style="height:450px;flex:none"></div><pre id="count"></pre><script>
let worker,jobFiles=0,processed=0,saved=0,last=performance.now(),maxDelay=0,loops=0;const $=id=>document.getElementById(id);const heartbeat=setInterval(()=>{const now=performance.now();maxDelay=Math.max(maxDelay,now-last-50);last=now;loops++;},50);let phase='';
$('start').onclick=()=>{jobFiles=0;saved=0;maxDelay=0;loops=0;$('start').disabled=true;$('cancel').disabled=false;worker=new Worker('../dist/worker.js');worker.onmessage=({data:m})=>{if(m.type==='saved')saved+=m.items.length;if(m.type==='ready'){if(jobFiles<3000){const files=[];for(let i=0;i<8&&jobFiles<3000;i++,jobFiles++)files.push(new File([jobFiles===1500?'broken xyz':'3\nsynthetic\nO 0 0 0\nH .95 0 0\nH -.24 .92 0\n'],`QA_${jobFiles}.xyz`));worker.postMessage({type:'files',files});}else worker.postMessage({type:'finish'});}if(m.stats){$('status').textContent=JSON.stringify(m.stats,null,2)+`\nUI応答 最大遅延 ${maxDelay.toFixed(0)} ms / heartbeat ${loops}回`;}if(m.type==='done'){worker.terminate();$('start').disabled=false;$('cancel').disabled=true;$('status').textContent+='\n完了：保存済み '+saved+' 分子';}};worker.postMessage({type:'start'});};$('cancel').onclick=()=>{jobFiles=3000;worker.postMessage({type:'cancel'});};
let vg=new Mol.VirtualGrid($('grid'));$('virtual').onclick=()=>{const data=Array.from({length:130000},(_,i)=>({id:'virtual-'+i,name:'仮想分子 '+i,count:3,thumb:false}));vg.setData(data);$('count').textContent=`全 ${data.length} 件 / DOM ${vg.nodes.size} タイル`};$('bottom').onclick=()=>{$('grid').scrollTop=$('grid').scrollHeight;requestAnimationFrame(()=>requestAnimationFrame(()=>$('count').textContent=`全 ${vg.data.length} 件 / DOM ${vg.nodes.size} タイル / 最終分子 ${vg.data.at(-1)?.name}`));};
</script></body></html>
