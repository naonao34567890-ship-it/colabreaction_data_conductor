<style>
.reaction-workspace { overflow-y: auto; }
.reaction-day { border-top: 1px solid var(--border); padding-top: 10px; margin-bottom: 16px; }
.reaction-grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(min(100%,220px),1fr)); gap: 12px; margin-top: 8px; }
.reaction-card { background: #191e1e; border: 1px solid var(--border); border-radius: 10px; padding: 10px; min-width: 0; }
.reaction-card .row { justify-content: space-between; }
.reaction-card h3 { margin: 0; overflow-wrap: anywhere; min-width: 0; }
.reaction-card button { padding: 4px 8px; }
.reaction-preview { display: grid; place-items: center; height: 135px; background: #101515; margin: 8px 0; }
.reaction-preview img { width: 100%; height: 135px; object-fit: contain; }
.reaction-slot { padding: 5px 0; border-top: 1px solid var(--border); }
.reaction-slot span { min-width: 0; overflow-wrap: anywhere; }
.reaction-slot .structure-name { cursor: pointer; }
</style>
</head>

    <div id="reactionDays"></div>
  </main>
</div>
