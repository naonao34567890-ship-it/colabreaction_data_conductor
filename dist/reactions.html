<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>反応ライブラリ</title>
<link rel="stylesheet" href="library-nav.css">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<script src="atomic-weights.js"></script>
<script src="common.js?v=names-2"></script>
<script src="reaction-store.js?v=run-ledger-1"></script>
<script src="worker.js?v=names-2"></script>
<script src="reaction-archive.js?v=names-2"></script>
<script src="molecular-clipboard.js"></script>
<script defer src="reactions.js?v=run-ledger-2"></script>
<style>
.reaction-workspace { overflow-y: auto; }
.reaction-card.selected { outline: 2px solid var(--accent); outline-offset: -2px; }
.reaction-selection-box { position: absolute; pointer-events: none; border: 1px solid var(--accent); background: #62d6bf22; z-index: 20; }
.reaction-day { border-top: 1px solid var(--border); padding-top: 10px; margin-bottom: 16px; }
.reaction-grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(min(100%,220px),1fr)); gap: 12px; margin-top: 8px; }
.reaction-card { background: #191e1e; border: 1px solid var(--border); border-radius: 10px; padding: 10px; min-width: 0; }
.reaction-card .row { justify-content: space-between; }
.reaction-card h3 { margin: 0; overflow-wrap: anywhere; min-width: 0; }
.reaction-card button { padding: 4px 8px; }
.reaction-preview { display: grid; place-items: center; height: 135px; background: #101515; margin: 8px 0; }
.reaction-preview img { width: 100%; height: 135px; object-fit: contain; }
.reaction-slot { padding: 5px 0; border-top: 1px solid var(--border); }
.reaction-slot span { min-width: 0; overflow-wrap: anywhere; }
.reaction-slot.openable { cursor: pointer; }
.reaction-slot .structure-name { margin-right: auto; cursor: text; }
.reaction-tidy-toolbar {display:flex;flex-wrap:wrap;gap:9px;align-items:center}
.reaction-tidy-group{display:flex;align-items:center;flex-wrap:wrap;gap:6px;padding:7px 9px;border:1px solid var(--border);background:#161d1d;border-radius:10px;min-width:0}
.reaction-primary-actions{flex:2 1 420px;border-color:#36594f}
.reaction-view-actions{flex:1 1 245px}
.reaction-tidy-label{font-size:11px;color:var(--muted);letter-spacing:.05em;margin-right:5px}
#reactionDelete{color:#eb9a9a;border-color:#654343}
.reaction-export-menu{position:relative;margin:0}
.reaction-export-menu>summary{cursor:pointer;list-style:none;border:1px solid var(--border);border-radius:7px;padding:8px 10px;white-space:nowrap;font-size:.9em}
.reaction-export-menu>summary::-webkit-details-marker{display:none}
.reaction-export-menu>summary::after{content:" ▾";color:var(--muted)}
.reaction-export-content{display:grid;gap:6px;position:absolute;right:0;top:calc(100% + 5px);z-index:40;padding:10px;min-width:275px;border:1px solid var(--border);border-radius:9px;background:#192222;box-shadow:0 8px 24px #0008}
.reaction-export-content button{white-space:normal;text-align:left}
@media(max-width:700px){.reaction-tidy-group{flex:1 1 100%}}
</style>
<link rel="stylesheet" href="ui-controls.css"><link rel="stylesheet" href="library-shell.css">
</head>
<body>
<div class="page">
<nav class="mode-switch" aria-label="ナビゲーション">
<a class="mode-link" href="index.html">ホーム</a>
<a class="mode-link" href="library.html">分子ライブラリ</a>
<a class="mode-link" href="reactions.html" aria-current="page">反応ライブラリ</a>
<a class="mode-link" href="colab.html">Colab計算記録</a>
<a class="mode-link" href="orca.html">ORCA計算結果</a>
</nav>
  <header class="library-shell-header">
    <div class="toolbar reaction-tidy-toolbar tidy-toolbar" aria-label="反応ライブラリの操作">
      <div class="reaction-tidy-group tidy-group tidy-import"><span class="reaction-tidy-label">ファイル</span><button id="reactionImport" class="primary" type="button">＋ ZIPを選択</button><input id="reactionImportFile" type="file" accept=".zip,application/zip" hidden></div>
      <div class="reaction-tidy-group tidy-group reaction-primary-actions"><span class="reaction-tidy-label">選択・編集</span><button id="reactionAll">全選択</button><button id="reactionNone">全解除</button><button id="reactionDuplicate" disabled title="選択した反応を複製">複製</button></div>
      <div class="reaction-tidy-group tidy-group reaction-organize"><span class="reaction-tidy-label">整理</span><button id="reactionTag" disabled>タグ付け</button><button id="reactionClassify" disabled>分類</button><button id="reactionDelete" class="tidy-danger" disabled>削除</button></div>
      <details class="reaction-export-menu"><summary>ZIPの書き出し</summary><div class="reaction-export-content">
       <button id="reactionArchive" disabled>選択分を対応情報付きZIPで保存</button>
       <button id="reactionArchiveAll" disabled>全件を対応情報付きZIPで保存</button>
       <button id="reactionZip" disabled>選択分をXYZのみのZIPで保存</button>
      </div></details>
    </div>
<div class="row library-list-row"><h2>すべての反応</h2><span id="reactionCount" class="muted">0 反応</span><span class="spacer"></span><div class="reaction-view-actions"><span class="reaction-tidy-label">表示</span><select id="thumbnailMode" aria-label="サムネイルの表示形式"></select><label>並べ替え<select id="reactionOrder">
       <option value="classification" selected>分類の名前順</option>
       <option value="added-desc">追加時間降順</option><option value="added-asc">追加時間昇順</option>
       <option value="name-asc">名前順</option><option value="name-desc">名前逆順</option><option value="id">内部ID順</option>
      </select></label></div><small id="reactionSelection" class="muted">0 件選択中</small></div>
  </header>
  <main class="workspace reaction-workspace">
    <div class="heading library-shell-heading"><div><div class="eyebrow">MOLECULAR WORKSPACE / 03</div><h1>反応ライブラリ</h1></div><div class="badge">START / FINISH</div></div>
    <section id="reactionDrop" tabindex="0" aria-label="対応情報付き反応ZIPのドロップ領域" class="library-shell-drop">
      対応情報付き反応ZIPはこの領域にドロップすることもできます。ZIPの展開は不要です。
    </section>
    <p id="reactionStatus" class="muted" role="status">読み込み中…</p>
    <div id="reactionDays"></div>
    <dialog id="reactionClassificationDialog">
     <h2>反応の分類</h2>
     <label>分類名（既存の分類も選択可能）<input id="reactionClassificationName" list="reactionClassificationNames" maxlength="200" placeholder="分類名"></label>
     <datalist id="reactionClassificationNames"></datalist>
     <div class="dialog-actions">
      <button type="button" id="reactionClassificationCancel">閉じる</button>
      <button type="button" id="reactionClassificationRemove">分類を外す</button>
      <button type="button" id="reactionClassificationRename">分類名を一括変更</button>
      <button type="button" class="primary" id="reactionClassificationApply">選択反応に分類を設定</button>
     </div>
     <p class="muted">一括変更は選択反応が所属する分類を、新しい分類名にまとめて変更します。</p>
    </dialog>
  </main>
</div>
<dialog id="reactionTagDialog">
<form id="reactionTagForm">
<h2>選択した反応のタグ</h2>
<label>タグ名 <input id="reactionTagName" list="reactionTagNames" required></label>
<datalist id="reactionTagNames"></datalist>
<div class="dialog-actions">
<button type="button" id="reactionTagClose">戻る</button>
<button value="remove">タグを外す</button>
<button value="add" class="primary">タグを付ける</button>
</div>
<p id="reactionTagError" role="status"></p>
</form>
</dialog>
</body>
</html>
