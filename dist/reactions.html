<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>反応ライブラリ</title>
<link rel="stylesheet" href="library-nav.css">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<script src="atomic-weights.js"></script>
<script src="common.js"></script>
<script src="reaction-store.js"></script>
<script src="worker.js"></script>
<script src="reaction-archive.js"></script>
<script defer src="reactions.js"></script>
<style>
.reaction-workspace { overflow-y: auto; }
.reaction-card.selected { outline: 2px solid var(--accent); outline-offset: -2px; }
.reaction-selection-box { position: fixed; pointer-events: none; border: 1px solid var(--accent); background: #62d6bf22; z-index: 20; }
.reaction-day { border-top: 1px solid var(--border); padding-top: 10px; margin-bottom: 16px; }
.reaction-grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(min(100%,220px),1fr)); gap: 12px; margin-top: 8px; }
.reaction-card { background: #191e1e; border: 1px solid var(--border); border-radius: 10px; padding: 10px; min-width: 0; }
.reaction-card .row { justify-content: space-between; }
.reaction-card h3 { margin: 0; overflow-wrap: anywhere; min-width: 0; }
.reaction-card button { padding: 4px 8px; }
.reaction-preview { display: grid; place-items: center; height: 135px; background: #101515; margin: 8px 0; }
.reaction-preview img { width: 100%; height: 135px; object-fit: contain; }
.reaction-slot { padding: 5px 0; border-top: 1px solid var(--border); }
.reaction-slot span { min-width: 0; overflow-wrap: anywhere; }
.reaction-slot.openable { cursor: pointer; }
.reaction-slot .structure-name { margin-right: auto; cursor: text; }
</style>
</head>
<body>
<div class="page">
<nav class="mode-switch" aria-label="ナビゲーション">
<a class="mode-link" href="index.html">ホーム</a>
<a class="mode-link" href="library.html">分子ライブラリ</a>
<a class="mode-link" href="reactions.html" aria-current="page">反応ライブラリ</a>
<a class="mode-link" href="colab.html">Colab計算記録</a>
</nav>
  <main class="workspace reaction-workspace">
    <h1>反応ライブラリ</h1>
    <p class="muted">ColabReaction用のSTARTとFINISHの構造を、反応ごとにまとめる場所です。</p>
    <div class="toolbar">
      <select id="thumbnailMode" aria-label="サムネイルの表示形式"></select>
      <button id="reactionAll">全選択</button><button id="reactionNone">全解除</button>
      <button id="reactionTag" disabled>タグ付け</button><button id="reactionDelete" disabled>削除</button>
      <button id="reactionArchive" disabled>選択分を対応情報付きZIPで保存</button>
      <button id="reactionArchiveAll" disabled>全件を対応情報付きZIPで保存</button>
      <button id="reactionZip" disabled>選択分をXYZのみのZIPで保存</button><span id="reactionSelection" class="muted"></span>
    </div>
    <p class="muted">対応情報付きZIPは、出発物・生成物のペア、反応名、タグ、元データを保持します。移行用にはこちらを使い、ZIPのまま保管してください。</p>
    <section id="reactionDrop" tabindex="0" aria-label="対応情報付き反応ZIPの取り込み" style="border:1px dashed var(--border);padding:16px;margin:12px 0;border-radius:10px">
      対応情報付き反応ZIPをここにドロップ
      <button id="reactionImport">ZIPを選択して取り込む</button>
      <input id="reactionImportFile" type="file" accept=".zip,application/zip" hidden>
      <p class="muted">ZIPを展開する必要はありません。対応表からペアを復元し、既存の同じIDは内容を確認します。</p>
    </section>
    <p id="reactionStatus" class="muted" role="status">読み込み中…</p>
    <div id="reactionDays"></div>
  </main>
</div>
<dialog id="reactionTagDialog">
<form id="reactionTagForm">
<h2>選択した反応のタグ</h2>
<label>タグ名 <input id="reactionTagName" list="reactionTagNames" required></label>
<datalist id="reactionTagNames"></datalist>
<div class="dialog-actions">
<button type="button" id="reactionTagClose">戻る</button>
<button value="remove">タグを外す</button>
<button value="add" class="primary">タグを付ける</button>
</div>
<p id="reactionTagError" role="status"></p>
</form>
</dialog>
</body>
</html>
