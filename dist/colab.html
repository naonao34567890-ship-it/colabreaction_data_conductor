<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Colab計算記録</title><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script><script src="atomic-weights.js"></script>
<script src="common.js?v=names-2"></script><script src="worker.js?v=names-2"></script><link rel="stylesheet" href="library-nav.css"><style>#colabPage { height: 100dvh; overflow: hidden; }
#colabControls{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
#colabControls>.colab-connect-group{display:flex;align-items:center;flex-wrap:wrap;gap:7px;padding:6px 9px;border:1px solid #36594f;border-radius:9px;background:#161d1d}
.colab-action-label{font-size:11px;color:var(--muted)}
#colabControls>.colab-maintenance{position:relative;margin:0}
.colab-maintenance>summary{cursor:pointer;list-style:none;border:1px solid var(--border);border-radius:7px;padding:8px 10px;font-size:.9em}
.colab-maintenance>summary::-webkit-details-marker{display:none}
.colab-maintenance>summary::after{content:" ▾";color:var(--muted)}
.colab-maintenance-content{position:absolute;top:calc(100% + 5px);left:0;z-index:30;display:grid;gap:6px;min-width:270px;padding:10px;border:1px solid var(--border);border-radius:8px;background:#192222;box-shadow:0 8px 24px #0008}
#colabControls>#driveSetup{flex-basis:100%}
#colabControls>#colabStatus,#colabControls>#colabQueue,#colabControls>#colabErrors{flex-basis:100%;margin:2px 0}
#colabControls>label{margin-left:auto}
@media(max-width:600px){#colabControls>label{margin-left:0}.colab-connect-group{width:100%}}
#colabPage > .mode-switch { flex-shrink: 0; margin-bottom: 0; }
#colabPanel { display: flex; flex: 1; flex-direction: column; min-height: 0; overflow: hidden; }
#colabDrop { flex: 0 0 auto; }
#colabScroll { flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
#colabControls { max-height: none; overflow: visible; }
#colabResults { min-height: 0; overflow: visible; }
#colabDrop {
 display: flex;
 align-items: center;
 flex-wrap: wrap;
 column-gap: 8px;
 row-gap: 2px;
 padding: 0 4px;
 margin: 0;
 border: 1px dashed var(--border);
 line-height: 1.2;
}
#colabDrop label { display: inline-flex; align-items: center; gap: 4px; margin: 0; }
#colabDrop input[type="file"] { width: auto; max-width: 100%; padding: 1px 3px; font-size: 12px; line-height: 1.2; }
#classificationChoices { display: grid; gap: 6px; max-height: min(240px, 32dvh); overflow-y: auto; overscroll-behavior: contain; }
#classificationChoices button { min-width: 0; white-space: normal; overflow-wrap: anywhere; text-align: left; }
#classificationDialog .dialog-actions { flex-wrap: wrap; }
.colab-group-heading { padding: 6px 0; border-bottom: 1px solid var(--border); overflow-wrap: anywhere; }
#colabJobs { display: grid; gap: 12px; }
.colab-job{position:relative}
.colab-job.is-selected{border-color:#45bba0;box-shadow:inset 0 0 0 1px #45bba0}
.colab-select-toggle{position:absolute;top:10px;right:10px;z-index:2;width:19px;height:19px;cursor:pointer;accent-color:#45bba0}
.colab-job .colab-record-name{padding-right:30px}
#colabSelectionToolbar{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin:8px 0;padding:10px;border:1px solid #457668;border-radius:8px;background:#1a2926}
#colabSelectionToolbar[hidden]{display:none}
#colabSelectionToolbar button{font-size:13px}
.colab-job { padding: 12px; border: 1px solid var(--border); border-radius: 10px; }
.colab-notes { margin: 4px 0 10px; padding: 8px; border: 1px solid var(--border); border-radius: 6px; }
.colab-note-text { white-space: pre-wrap; overflow-wrap: anywhere; cursor: text; }
.colab-note-text:empty::before { content: "ダブルクリックで備考を入力"; color: var(--muted); }
.colab-note-error { color: #ff929f; }
.colab-record-name { margin: 0 0 8px; overflow-wrap: anywhere; }
#classificationCreate:enabled { background:#a82b40; color:white; border-color:#e27082; }
.colab-images { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.colab-meta { display: flex; gap: 16px; overflow-x: auto; white-space: nowrap; padding: 8px 0; }
.colab-images figure { min-width: 0; margin: 0; }
.colab-images img { display: block; width: 100%; height: 150px; object-fit: contain; }
</style><link rel="stylesheet" href="ui-controls.css"><link rel="stylesheet" href="library-shell.css">
</head>
<body><div class="page" id="colabPage">
<nav class="mode-switch" aria-label="ナビゲーション">
<a class="mode-link" href="index.html">ホーム</a>
<a class="mode-link" href="library.html">分子ライブラリ</a>
<a class="mode-link" href="reactions.html">反応ライブラリ</a>
<a class="mode-link" href="colab.html" aria-current="page">Colab計算記録</a>
<a class="mode-link" href="orca.html">ORCA計算結果</a>
</nav>
<section id="colabPanel" aria-labelledby="colabTitle">
<header class="library-shell-header">
  <div id="colabControls" class="toolbar tidy-toolbar" aria-label="Colab計算記録の操作">
    <div class="tidy-group tidy-import colab-import-actions"><span class="tidy-label">ファイル</span>
      <button id="colabFileButton" type="button" class="primary" disabled>＋ ZIPを選択</button>
      <button id="colabFolderButton" type="button" disabled>フォルダを選択</button>
      <input id="colabZip" type="file" multiple accept=".zip,application/zip" hidden disabled>
      <input id="colabFolder" type="file" webkitdirectory multiple hidden disabled>
    </div>
    <div class="colab-connect-group tidy-group"><span class="colab-action-label">Google Drive</span>
      <button id="driveConnect" type="button" class="primary">Google Driveに接続</button>
      <button id="driveTemporary" type="button">一時接続</button>
    </div>
    <details class="colab-maintenance"><summary>記録の管理・メンテナンス</summary><div class="colab-maintenance-content">
      <button id="replotExisting" type="button" disabled title="保存済みのDMF_energy.csvから全Energy.pngを新しい目盛り仕様で再生成します">既存のエネルギー画像を更新</button>
    </div></details>
  </div>
  <div class="row library-list-row">
    <h2>すべての計算記録</h2><span id="colabCount" class="muted"></span><span class="spacer"></span>
    <label>並び順 <select id="colabOrder" autocomplete="off">
      <option value="name-asc">名前順</option>
      <option value="added-asc">追加時間昇順</option>
      <option value="added-desc">追加時間降順</option>
      <option value="name-desc">名前逆順</option>
      <option value="id">内部ID順</option>
      <option value="classification" selected>分類の名前順</option>
    </select></label>
  </div>
</header>
<div id="colabScroll" role="region" aria-label="Colab計算履歴の操作・ログ・一覧" tabindex="0">
<div class="heading library-shell-heading"><div><div class="eyebrow">MOLECULAR WORKSPACE / 04</div><h1 id="colabTitle">Colab計算履歴</h1></div><div class="badge">Google Drive / Colab</div></div>
<div id="colabDrop" class="library-shell-drop" aria-label="Colab計算結果ドロップ領域">計算結果のZIPまたはフォルダーは、この領域にドラッグ＆ドロップすることもできます。</div>
<form id="driveSetup" hidden>
  <label>Googleクライアントシークレット<input id="driveSecret" type="password" autocomplete="new-password" required></label>
  <button type="submit">設定を保存</button>
</form>
<div class="library-shell-status">
  <p id="colabStatus" role="status">Google Driveに接続すると計算記録を表示します。</p>
  <p id="colabQueue" role="status">待機中 0件</p>
  <div id="colabErrors" role="status"></div>
</div>
<div id="colabResults" role="region" aria-label="計算履歴一覧" tabindex="0">
<div id="colabSelectionToolbar" role="toolbar" aria-label="計算記録の選択操作" hidden>
<span id="colabSelectionCount" role="status">0件選択</span>
<button id="colabSelectionClassify" type="button">選択した記録の分類を一括変更</button>
<button id="colabSelectionClear" type="button">選択解除</button>
</div>
<div id="colabJobs"></div>
<p id="colabLoading" class="muted" role="status" hidden>ロード中…</p>
</div>
</div>
<dialog id="classificationDialog" aria-labelledby="classificationTitle">
<h2 id="classificationTitle">分類を選ぶ</h2>
<p id="classificationCurrent"></p>
<div id="classificationChoices"></div>
<div class="dialog-actions">
<button type="button" id="classificationNew">新規に作る</button>
<button type="button" id="classificationRename">名前を変更する</button>
<button type="button" id="classificationRemove" class="danger">分類を外す</button>
<button type="button" id="classificationCancel">キャンセル</button>
</div>
<form id="classificationForm" hidden>
<label>分類名<input id="classificationName" required></label>
<button id="classificationCreate" class="danger" disabled>作成して設定</button>
</form>
<p id="classificationStatus" role="status"></p>
</dialog>
</section>
</div><script type="module" src="colab-records.js?v=select-batch-fix-20261125"></script></body></html>
