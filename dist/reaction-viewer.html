<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>反応経路ビューア</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<script src="common.js"></script>
<style>
#frameNumbers{position:absolute;inset:0;pointer-events:none}
#energyPlot{display:block;width:100%;height:auto}
#slideStatus{min-height:1.5em;margin-top:8px}
#frameCount{font-variant-numeric:tabular-nums;font-size:24px}
</style>
</head>
<body data-viewer="reaction">
<div class="page">
<header>
<div class="heading"><div><div class="eyebrow">COLAB / REACTION PATH</div><h1 id="title">反応経路ビューア</h1></div><span class="badge">XYZ · フレーム表示</span></div>
<div class="toolbar">
<button id="numbers" aria-pressed="false" disabled>原子番号を表示</button>
<button id="prevTen" aria-label="10枚前" title="10枚前" disabled>◀◀</button>
<button id="prev" aria-label="1枚前" title="1枚前" disabled>◀</button>
<button id="next" aria-label="1枚先" title="1枚先" disabled>▶</button>
<button id="nextTen" aria-label="10枚先" title="10枚先" disabled>▶▶</button>
<button id="importFrame" disabled>この構造をライブラリに取り込み</button>
<button id="downloadFrame" disabled>この構造をダウンロード</button>
<button id="importAll" disabled>すべての構造を取り込み</button>
<button id="importMany" disabled>構造を複数選んで取り込み</button>
</div>
<p id="slideStatus" class="status" role="status">XYZを読み込み中…</p>
</header>
<main class="editor-main">
<section class="viewport" id="view" aria-label="構造の3Dビュー">
<div class="view-label">3D VIEW / Å</div><canvas id="frameNumbers" hidden aria-hidden="true"></canvas>
<div class="view-info" id="atomCount"></div>
</section>
<aside class="sidebar">
<section class="panel"><h2>現在の構造 / 全構造</h2><p id="frameCount">— / —</p><p id="frameEnergy" class="muted"></p></section>
<section class="panel"><h2>フレーム–最初からのエネルギー変化量</h2>
<canvas id="energyPlot" width="580" height="420" role="img" aria-label="フレーム番号とエネルギー変化量（kJ/mol）"></canvas>
<p id="energyHint" class="muted"></p></section>
</aside>
</main>
</div>
<dialog id="rangesDialog">
<form id="rangesForm">
<h2>構造を複数選んで取り込み</h2>
<label>フレーム番号<input id="ranges" placeholder="例 1-4,5-15" required></label>
<p id="rangeError" role="alert"></p>
<div class="dialog-actions"><button type="button" id="rangeClose">戻る</button><button class="primary" type="submit">取り込み</button></div>
</form>
</dialog>
<script src="worker.js"></script>
<script type="module" src="slideshow.js"></script>
</body>
</html>
