<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>反応経路ビューア</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<script src="atomic-weights.js"></script>
<script src="common.js?v=spxyz-1"></script>
<script src="reaction-store.js"></script><script src="reaction-archive.js"></script>
<link rel="stylesheet" href="frame-save.css">
<style>
.playback-control{display:inline-flex;align-items:center;gap:6px;font-size:14px}
.playback-strip{display:flex;flex:0 0 auto;align-items:center;gap:6px;flex-wrap:wrap}
.playback-strip button{padding:7px 10px}
.playback-control[hidden]{display:none!important}
#autoPlay[aria-pressed="true"]{outline:2px solid #62d6bf}

#frameNumbers{position:absolute;inset:0;pointer-events:none}
#energyPlot{display:block;width:100%;height:auto}
#slideStatus{min-height:1.5em;margin-top:8px}
#frameCount{font-variant-numeric:tabular-nums;font-size:24px}
</style>
<link rel="stylesheet" href="ui-controls.css">
</head>
<body data-viewer="reaction">
<div class="page">
<header>
<div class="heading"><div><div class="eyebrow">COLAB / REACTION PATH</div><h1 id="title">反応経路ビューア</h1></div><span class="badge">XYZ · フレーム表示</span></div>
<div class="toolbar viewer-toolbar">
<!-- The playback strip stays first in both viewers, regardless of vibration mode. -->
<div class="playback-strip" role="group" aria-label="フレーム再生操作">
<button id="prevTen" aria-label="10枚前" title="10枚前" disabled>◀◀</button>
<button id="prev" aria-label="1枚前" title="1枚前" disabled>◀</button>
<button id="autoPlay" type="button" disabled aria-pressed="false">▶ 自動送り</button>
<button id="next" aria-label="1枚先" title="1枚先" disabled>▶</button>
<button id="nextTen" aria-label="10枚先" title="10枚先" disabled>▶▶</button>
<label class="playback-control">速度 <select id="playbackSpeed" aria-label="自動送り速度"><option value="1">1 枚/秒</option><option value="2">2 枚/秒</option><option value="4" selected>4 枚/秒</option><option value="8">8 枚/秒</option><option value="12">12 枚/秒</option><option value="24">24 枚/秒</option><option value="48">48 枚/秒</option></select></label>
</div><div class="viewer-tool-group" aria-label="再生表示設定"><span class="viewer-tool-label">表示</span><label class="playback-control">表示 <select id="viewerMode" aria-label="反応経路と振動の切替"><option value="reaction">反応経路</option><option value="vibration">振動アニメーション</option></select></label><label id="vibrationPeakControl" class="playback-control" hidden>極大点 <select id="vibrationPeak" aria-label="振動する極大点"></select></label><label id="vibrationModeControl" class="playback-control" hidden>振動モード <select id="vibrationMode" aria-label="振動モード"></select></label><select id="displayMode" aria-label="分子の表示形式"></select><button id="numbers" aria-pressed="false" disabled>原子番号を表示</button></div>
<div class="viewer-tool-group viewer-save-group" aria-label="構造の保存"><span class="viewer-tool-label">構造の保存</span>
<div class="frame-import-actions">
<button id="importStart" class="primary" disabled>反応ライブラリに出発物として保存</button>
<div class="frame-import-options">
<button id="importFrame" disabled>分子ライブラリに保存</button>
<button id="importFinish" disabled>反応ライブラリに生成物として保存</button>
<button disabled>出発物を選んで生成物として保存（準備中）</button>
<button id="importFrameEdit" disabled>反応ライブラリに出発物として保存してエディタを開く</button>
<button id="saveGroundSpxyz" type="button" disabled>基底状態のspxyzファイルとして保存</button>
<button id="saveTsSpxyz" type="button" disabled>TSのspxyzファイルとして保存</button>
</div>
</div>
<button id="importMany" disabled>反応の始点・終点を選ぶ</button>
</div>
<details class="viewer-options-menu"><summary>その他の保存・出力</summary><div class="viewer-options-menu-content">
<span class="viewer-tool-label">画像の保存</span><button id="saveStartImage" disabled>この画像をSTARTに使用</button><button id="saveFinalImage" disabled>この画像をFINALに使用</button><button id="downloadFrame" disabled>この構造をダウンロード</button><button id="importAll" disabled>すべての構造を取り込み</button>
</div></details>
</div>
<p id="slideStatus" class="status" role="status">XYZを読み込み中…</p>
</header>
<main class="editor-main">
<section class="viewport" id="view" aria-label="構造の3Dビュー">
<div class="view-label">3D VIEW / Å</div><canvas id="frameNumbers" hidden aria-hidden="true"></canvas>
<div class="view-info" id="atomCount"></div>
</section>
<aside class="sidebar">
<section class="panel"><h2>現在の構造 / 全構造</h2><p id="frameCount">— / —</p><p id="frameEnergy" class="muted"></p></section>
<section class="panel"><h2>フレーム–最初からのエネルギー変化量</h2>
<canvas id="energyPlot" width="580" height="420" role="img" aria-label="フレーム番号とエネルギー変化量（kJ/mol）"></canvas>
<p id="energyHint" class="muted"></p></section>
</aside>
</main>
</div>
<dialog id="rangesDialog">
<form id="rangesForm">
<h2>反応の始点・終点を選ぶ</h2>
<label>出発物（START）の番号<input id="startFrame" type="number" min="1" step="1" required></label>
<label>生成物（FINISH）の番号<input id="finishFrame" type="number" min="1" step="1" required></label>
<p id="rangeError" role="alert"></p>
<div class="dialog-actions"><button type="button" id="rangeClose">戻る</button><button class="primary" type="submit">反応として保存</button></div>
</form>
</dialog>
<dialog id="frameSpxyzDialog">
<form id="frameSpxyzForm">
<h2 id="frameSpxyzTitle"></h2>
<label>ファイル名<input id="frameSpxyzName" required></label>
<label>電荷数<input id="frameSpxyzCharge" type="number" step="1" required></label>
<label>スピン多重度<input id="frameSpxyzMultiplicity" type="number" min="1" step="1" required></label>
<label>溶媒<select id="frameSpxyzSolvent">
  <option value="none">none（気相）</option>
  <option value="Acetonitrile">AN（アセトニトリル）</option>
  <option value="DMSO">DMSO</option>
  <option value="Chloroform">クロロホルム</option>
  <option value="Acetone">アセトン</option>
  <option value="Ethylacetate">酢酸エチル（酢エチ）</option>
  <option value="Water">水</option>
  <option value="Diethylether">ジエチルエーテル</option>
  <option value="DMF">DMF</option>
</select></label>
<p id="frameSpxyzError" role="alert"></p>
<div class="dialog-actions"><button id="frameSpxyzBack" type="button">戻る</button><button type="submit" class="primary">保存</button></div>
</form>
</dialog>
<script src="worker.js"></script>
<script type="module" src="slideshow.js?v=frame-spxyz-1"></script>
</body>
</html>
