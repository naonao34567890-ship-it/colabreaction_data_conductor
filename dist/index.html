<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>分子 XYZ ライブラリ</title><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script><script src="common.js"></script><script src="worker.js"></script></head>
<body><div class="page"><header><div class="heading"><div><div class="eyebrow">MOLECULAR WORKSPACE / 01</div><h1>分子 XYZ ライブラリ</h1></div><div class="badge">ローカル保存 · XYZ / QM9</div></div><div class="toolbar"><button class="primary" id="fileButton">＋ ファイルを選択</button><button id="folderButton">フォルダを選択</button><input hidden type="file" id="files" multiple accept=".xyz"><input hidden type="file" id="folder" multiple webkitdirectory><span class="spacer"></span><button id="all">全選択</button><button id="none">全解除</button><button id="open" disabled>エディタで開く ↗</button><button id="download" disabled>ダウンロード ↓</button></div><div class="progress-area"><div class="row"><span id="progressText">ファイル・フォルダを登録できます</span><span class="spacer"></span><span id="queued">待機中 0件</span><button id="cancel" disabled>キャンセル</button></div><progress id="progress" value="0" max="1"></progress></div></header><main class="workspace"><div class="row"><h2>すべての分子</h2><span id="count" class="muted">0 分子</span><span class="spacer"></span><small id="selected">0 選択中</small></div><div class="grid-view" id="grid"><div id="empty" class="empty"><div><b>分子を、ひとつの場所に。</b>xyz ファイルやフォルダをドロップして登録<br><small>複数分子ファイル・QM9形式に対応</small></div></div></div><div class="drop-hint">このページに xyz ファイル・フォルダをドロップ　／　ダブルクリックで分子エディタを開く</div><details id="results"><summary id="summary">読み込み結果</summary><pre id="resultText"></pre></details><div class="status" id="notice" role="status" aria-live="polite"></div></main></div>
<dialog id="exportDialog"><h2>選択した分子をダウンロード</h2><label>保存する名前<input id="exportName" value="molecules"></label><label id="formatLabel">出力形式<select id="format"><option value="zip">ZIP（分子ごとの xyz）</option><option value="xyz">1つの連結 xyz</option></select></label><p class="muted" id="exportHint"></p><div class="dialog-actions"><button id="closeDialog">戻る</button><button class="primary" id="exportStart">保存する</button></div></dialog>
<script>
'use strict';
const $=id=>document.getElementById(id);let meta=[],selected=new Set(),jobs=[],active=null,exporting=false,exportCancel=null;const channel=new BroadcastChannel('molecular-xyz');
const grid=new Mol.VirtualGrid($('grid'),{onSelect:m=>{selected.has(m.id)?selected.delete(m.id):selected.add(m.id);selectionUI();},isSelected:id=>selected.has(id),onOpen:openEditor,onDelete:async m=>{try{await Mol.remove(m.id);applyChange({type:'deleted',id:m.id});Mol.notify({type:'deleted',id:m.id});}catch(e){notice(e.message);}}});
function notice(s){$('notice').textContent=s;}
function openEditor(m){window.open('editor.html?id='+encodeURIComponent(m.id),'_blank','noopener');}
function selectionUI(){ $('selected').textContent=selected.size.toLocaleString()+' 選択中';$('download').disabled=!selected.size||exporting||!!active;$('open').disabled=selected.size!==1;}
function refresh(){grid.setData(meta);$('count').textContent=meta.length.toLocaleString()+' 分子';$('empty').hidden=!!meta.length;$('empty').style.display=meta.length?'none':'flex';selectionUI();}
let metaMap=new Map();function applyChange(m){if(m.type==='added'){for(const item of m.items){if(!metaMap.has(item.id)){meta.push(item);metaMap.set(item.id,item);}}}else if(m.type==='deleted'){metaMap.delete(m.id);meta=meta.filter(x=>x.id!==m.id);selected.delete(m.id);}refresh();}
channel.onmessage=e=>applyChange(e.data);Mol.metadata().then(v=>{for(const m of v)if(!metaMap.has(m.id)){meta.push(m);metaMap.set(m.id,m);}refresh();}).catch(e=>notice('保存領域を開けません: '+e.message));
$('all').onclick=()=>{selected=new Set(meta.map(m=>m.id));selectionUI();grid.render();};$('none').onclick=()=>{selected.clear();selectionUI();grid.render();};$('open').onclick=()=>{const m=metaMap.get(selected.values().next().value);if(m)openEditor(m);};
$('fileButton').onclick=()=>$('files').click();$('folderButton').onclick=()=>$('folder').click();for(const id of ['files','folder'])$(id).onchange=e=>{enqueue({files:Array.from(e.target.files)});e.target.value='';};
let dragDepth=0;document.addEventListener('dragenter',e=>{if(e.dataTransfer.types.includes('Files')){e.preventDefault();dragDepth++;document.body.classList.add('dragging');}});document.addEventListener('dragover',e=>e.preventDefault());document.addEventListener('dragleave',()=>{if(--dragDepth<=0)document.body.classList.remove('dragging');});document.addEventListener('drop',e=>{e.preventDefault();dragDepth=0;document.body.classList.remove('dragging');const items=Array.from(e.dataTransfer.items||[]);const entries=items.map(i=>i.webkitGetAsEntry?.()).filter(Boolean);enqueue(entries.length?{entries}:{files:Array.from(e.dataTransfer.files)});});
function enqueue(job){jobs.push(job);queueUI();runQueue();}function queueUI(){$('queued').textContent=`待機中 ${jobs.length}件`;}
async function scan(job,state){if(job.files)return job.files.filter(f=>/\.xyz$/i.test(f.name));return Mol.scanEntries(job.entries,{cancelled:()=>state.cancelled,progress:n=>{$('progressText').textContent=`フォルダ走査中 · ${n.toLocaleString()} 個のxyzを発見`;},error:message=>state.scanErrors.push(message)});}
async function runQueue(){if(active||exporting||!jobs.length)return;const state={cancelled:false,scanErrors:[],started:Date.now(),stats:{processed:0,registered:0,skipped:0,failed:0},total:0,worker:null};active=state;selectionUI();const job=jobs.shift();queueUI();$('cancel').disabled=false;$('progress').removeAttribute('value');$('progressText').textContent='ファイルを確認しています…';
 try{const found=await scan(job,state);state.total=found.length;if(state.cancelled){$('summary').textContent='フォルダ走査をキャンセルしました（登録開始前）';return;}if(found.length>2000&&!confirm(`${found.length.toLocaleString()} 個のxyzを登録します。保存容量と処理時間が必要です。続行しますか？`))return;
  const onEvent=m=>{if(m.type==='saved')applyChange({type:'added',items:m.items});if(m.stats){state.stats=m.stats;progressUI(state);}if(m.type==='done'){const s=m.stats;const head=`${m.cancelled?'キャンセル':'完了'} · 登録 ${s.registered} 分子 / 分割による増加 ${s.extra} / スキップ ${s.skipped} / 失敗 ${s.failed}`;$('summary').textContent=head;$('resultText').textContent=[head,s.fatal||'',...Object.entries(s.reasons).map(([k,v])=>`${k}: ${v} 件`),'詳細（先頭30件）',...s.examples,...state.scanErrors].filter(Boolean).join('\n');if(s.fatal)notice(s.fatal+`。登録済み ${s.registered} 分子は保持しました。`);}};
  let worker,waiter=null,fallback=null;
  const request=(message)=>new Promise((resolve,reject)=>{waiter={resolve,reject};worker.postMessage(message);});
  try{worker=new Worker('worker.js');state.worker=worker;worker.onmessage=e=>{onEvent(e.data);if(['ready','done','error'].includes(e.data.type)&&waiter){const w=waiter;waiter=null;e.data.type==='error'?w.reject(Error(e.data.message)):w.resolve(e.data);}};worker.onerror=e=>{if(waiter){waiter.reject(Error(e.message||'Worker起動失敗'));waiter=null;}};await request({type:'start'});}catch(e){worker?.terminate();worker=null;state.worker=null;fallback=new MolJobs.ImportJob(onEvent);state.fallback=fallback;notice('Workerを使用できないため、処理を小分けにして登録します。');}
  for(let p=0;p<found.length&&!state.cancelled;p+=8){const settled=await Promise.allSettled(found.slice(p,p+8).map(f=>f instanceof File?f:new Promise((r,j)=>f.file(r,j))));const files=[];for(const r of settled)if(r.status==='fulfilled')files.push(r.value);else state.scanErrors.push(String(r.reason));if(state.cancelled)break;if(worker)await request({type:'files',files});else await fallback.files(files);if(fallback?.cancelled||state.stats.fatal){state.cancelled=true;break;}await Mol.tick();}
  if(worker)await request({type:'finish'});else await fallback.finish();
 }catch(e){notice('登録処理: '+e.message+'。保存済みの分子は保持されます。');}finally{state.worker?.terminate();active=null;selectionUI();if(!exporting)$('cancel').disabled=true;queueUI();runQueue();}
}
function progressUI(s){const n=s.stats,sec=(Date.now()-s.started)/1000,eta=n.processed?Math.max(0,(s.total-n.processed)*sec/n.processed):0;$('progress').max=s.total||1;$('progress').value=n.processed;$('progressText').textContent=`${n.processed.toLocaleString()} / ${s.total.toLocaleString()} ファイル · 登録 ${n.registered} · スキップ ${n.skipped} · 経過 ${Math.round(sec)}秒 · 残り約 ${Math.round(eta)}秒`;}
$('cancel').onclick=()=>{if(exporting&&exportCancel){exportCancel();return;}if(active){active.cancelled=true;active.worker?.postMessage({type:'cancel'});if(active.fallback)active.fallback.cancelled=true;$('progressText').textContent='キャンセル中… 保存済みの分子は保持します';}};
$('download').onclick=()=>{$('exportName').value=selected.size===1?metaMap.get(selected.values().next().value).name:'molecules';$('formatLabel').hidden=selected.size===1;$('exportHint').textContent=selected.size+' 分子。未編集のコメント・追加列・フッターを保持します。';$('exportDialog').showModal();};$('closeDialog').onclick=()=>$('exportDialog').close();
$('exportStart').onclick=async()=>{
 const ids=Array.from(selected),format=ids.length===1?'xyz':$('format').value,name=Mol.safeName($('exportName').value)+'.'+format,estimate=ids.reduce((s,id)=>s+(metaMap.get(id)?.bytes||0)+200,0);
 if(ids.length>10000&&!confirm(`${ids.length.toLocaleString()} 分子、非圧縮で約 ${(estimate/1048576).toFixed(1)} MiB。処理目安 ${Math.ceil(ids.length/1500)}〜${Math.ceil(ids.length/100)} 秒（端末に依存）。続行しますか？`))return;
 let sink=null;try{if(window.showSaveFilePicker){const handle=await showSaveFilePicker({suggestedName:name});sink=await handle.createWritable();}}catch(e){if(e.name==='AbortError')return;notice('直接保存を利用できないため、ブラウザのダウンロードを使います。');}
 $('exportDialog').close();exporting=true;selectionUI();$('cancel').disabled=false;let cancelled=false,worker=null,chunks=[],bytes=0;
 exportCancel=()=>{cancelled=true;worker?.terminate();finishReject?.(Error('キャンセル'));};let finishReject;
 const send=async data=>{if(cancelled)throw Error('キャンセル');bytes+=data.length;if(sink)await sink.write(data);else{if(bytes>512*1048576)throw Error('直接保存非対応のブラウザでは512 MiB以内に分けてください');chunks.push(data);}};
 const update=n=>{$('progress').max=ids.length;$('progress').value=n;$('progressText').textContent=`ダウンロード準備 ${n.toLocaleString()} / ${ids.length.toLocaleString()} 分子 · ${(bytes/1048576).toFixed(1)} MiB`;};
 try{update(0);let ready=false;try{worker=new Worker('worker.js');await new Promise((resolve,reject)=>{worker.onmessage=e=>{if(e.data.type==='ready')resolve();};worker.onerror=reject;worker.postMessage({type:'start'});});ready=true;}catch(e){worker?.terminate();worker=null;}
  if(ready)await new Promise((resolve,reject)=>{finishReject=reject;worker.onmessage=async e=>{try{const m=e.data;if(m.type==='chunk'){await send(m.bytes);worker?.postMessage({type:'ack'});}else if(m.type==='exportProgress')update(m.done);else if(m.type==='exportDone')resolve();else if(m.type==='error')reject(Error(m.message));}catch(e){reject(e);}};worker.onerror=e=>reject(Error(e.message));worker.postMessage({type:'export',ids,format});});
  else await MolJobs.exportData(ids,format,send,()=>cancelled,update);
  if(cancelled)throw Error('キャンセル');if(sink)await sink.close();else Mol.downloadBlob(new Blob(chunks,{type:format==='zip'?'application/zip':'chemical/x-xyz'}),name);notice('ダウンロードの準備が完了しました。');
 }catch(e){try{await sink?.abort();}catch(_){}notice('ダウンロード: '+e.message);}finally{worker?.terminate();chunks=[];exporting=false;exportCancel=null;selectionUI();$('cancel').disabled=!active;if(active)progressUI(active);runQueue();}
};
document.addEventListener('webgl-error',()=>notice('WebGLを利用できません。3D表示にはWebGL対応ブラウザとハードウェアアクセラレーションが必要です。'));
document.addEventListener('graphics-error',()=>notice('3Dライブラリを読み込めません。インターネット接続・CDNへの接続を確認してください。'));
</script></body></html>
