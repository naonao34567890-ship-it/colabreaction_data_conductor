<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ORCA計算結果ギャラリー — Mol Bench</title>
<link rel="stylesheet" href="catalogue-base.css"><link rel="stylesheet" href="library-nav.css">
<style>

a{color:var(--accent)}
.muted{color:var(--muted)}.toolbar input{max-width:270px}
#drop{padding:25px;border:1px dashed #618078;background:#16221e;border-radius:12px;text-align:center;cursor:pointer}#drop.drag{background:#243f35}#drop p{margin:6px}#status{min-height:25px}
#cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px;margin:15px 0}.card{padding:14px;background:#17201d;border:1px solid var(--border);border-radius:12px;min-width:0}.card h2{overflow-wrap:anywhere}.meta{font-size:.89rem;color:var(--muted);display:grid;gap:2px}.status-chip{display:inline-block;border-radius:12px;padding:2px 9px;font-size:.78rem;background:#46544e;color:#eef5f2}.ok{background:#1c5744}.fail{background:#70383a}.preview{height:150px;background:#0b1311;border-radius:8px;display:flex;align-items:center;justify-content:center;margin:12px 0}.preview img{max-height:100%;max-width:100%;object-fit:contain}.card-actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px}.card-actions button{padding:6px 9px;font-size:.85rem}
#detail{border:1px solid var(--border);border-radius:12px;background:#121d19;color:var(--ink);width:min(1050px,95vw);max-height:92vh;padding:18px}#detail::backdrop{background:#000b}#detail header{display:flex;align-items:center;justify-content:space-between;gap:12px}#detail header h2{margin:0}#detailFiles{display:flex;gap:7px;flex-wrap:wrap}#detailImages{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin:14px 0}#detailImages figure{margin:0}#detailImages img{max-width:100%;max-height:300px}#detailImages figcaption{font-size:.85rem;color:var(--muted);overflow-wrap:anywhere}
pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:32vh;overflow:auto;padding:12px;background:#07110e;border-radius:7px;font-size:.78rem}.progress{accent-color:var(--accent);width:min(390px,95%)}#fileInfo{font-size:.85rem;color:var(--muted)}
.orca-tidy-toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:9px}
.orca-search-group{display:flex;align-items:center;gap:9px;flex-wrap:wrap;flex:1 1 480px;padding:8px 10px;border:1px solid #426a60;background:#16201d;border-radius:9px}
.orca-tidy-label{font-size:11px;color:var(--muted)}
.orca-search-group #search{flex:1 1 190px;max-width:none;min-width:130px}
.orca-export-menu{position:relative;margin:0}
.orca-export-menu>summary{list-style:none;cursor:pointer;padding:8px 11px;border-radius:7px;border:1px solid var(--border);white-space:nowrap}
.orca-export-menu>summary::-webkit-details-marker{display:none}
.orca-export-menu>summary::after{content:" ▾";color:var(--muted)}
.orca-export-options{position:absolute;top:calc(100% + 5px);right:0;z-index:20;min-width:225px;display:grid;gap:6px;padding:10px;border:1px solid var(--border);background:#192521;border-radius:9px;box-shadow:0 8px 24px #0008}
.orca-export-options button{white-space:normal;text-align:left}

#drop strong{font-size:13px}
#drop button:first-of-type{border-color:#548b78;font-weight:700}
@media(max-width:650px){.orca-search-group{flex-basis:100%}.orca-export-options{right:auto;left:0}}
@media(max-width:650px){#cards{grid-template-columns:1fr}}
</style><link rel="stylesheet" href="ui-controls.css"><link rel="stylesheet" href="library-shell.css">
</head>
<body><div class="page" id="orcaPage">
<nav class="mode-switch" aria-label="ナビゲーション">
<a class="mode-link" href="index.html">ホーム</a>
<a class="mode-link" href="library.html">分子ライブラリ</a>
<a class="mode-link" href="reactions.html">反応ライブラリ</a>
<a class="mode-link" href="colab.html">Colab計算記録</a>
<a class="mode-link" href="orca.html" aria-current="page">ORCA計算結果</a>
</nav>
<header class="library-shell-header">
  <div class="toolbar tidy-toolbar orca-tidy-toolbar" aria-label="ORCAギャラリーの操作">
    <div class="tidy-group tidy-import orca-import-actions"><span class="tidy-label">ファイル</span>
      <button id="choose" type="button" class="tidy-primary">＋ ファイルを選択</button>
      <button id="chooseFolder" type="button">フォルダを選択</button>
    </div>
    <div class="tidy-group orca-export-actions"><span class="tidy-label">出力</span>
      <details class="orca-export-menu"><summary>データの出力</summary><div class="orca-export-options"><button id="exportIndex" type="button">一覧JSONを書き出す</button></div></details>
    </div>
  </div>
  <div class="row library-list-row">
    <h2>すべての計算結果</h2><span id="count" class="muted"></span><span class="spacer"></span>
    <div class="orca-search-group"><span class="orca-tidy-label">検索と表示</span>
      <input id="search" type="search" placeholder="計算名・分類・備考を検索" aria-label="ギャラリーを検索">
      <label>並べ替え <select id="order"><option value="newest">登録日時・新しい順</option><option value="oldest">登録日時・古い順</option><option value="name">名前順</option><option value="energy">最終エネルギー順</option><option value="status">終了状態順</option></select></label>
    </div>
  </div>
</header>
<main class="workspace orca-workspace" id="orcaScroll">
<div class="heading library-shell-heading"><div><div class="eyebrow">MOLECULAR WORKSPACE / 05</div><h1>ORCA計算結果</h1></div><div class="badge">ORCA / ローカル記録</div></div>
<section id="drop" tabindex="0" role="button" aria-label="ORCA計算結果のZIPまたはファイルを読み込む" class="library-shell-drop">
ORCA計算ファイル・ZIPはページ全体にドロップできます。フォルダは上の選択ボタンから追加できます。
<input id="upload" type="file" multiple hidden accept=".zip,.out,.log,.xyz,.png,.jpg,.jpeg,.json,.inp,.engrad,.hess,.gbw,.trj">
<input id="folder" type="file" webkitdirectory multiple hidden>
</section>
<p id="status" role="status"></p><progress id="progress" class="progress" hidden></progress>
<div id="cards"></div>
<dialog id="detail"><header><h2 id="detailTitle"></h2><button id="closeDetail" type="button">閉じる</button></header>
<p id="detailMeta" class="muted"></p><div id="detailImages"></div><h3>保存ファイル</h3><div id="detailFiles"></div>
<h3>出力ログ（先頭・末尾）</h3><pre id="detailLog"></pre></dialog>
<p id="fileInfo">注意：ブラウザのサイトデータを削除すると、このギャラリーのローカル記録も消えます。元のORCA計算ZIPを別途保存してください。</p>
</main>
</div><script type="module" src="orca-gallery.js"></script></body></html>
